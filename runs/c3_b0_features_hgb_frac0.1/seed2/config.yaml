  cache_dir: data/processed
  sampling_rate: 100
  bandpass: false
  train_folds:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  val_folds:
  - 9
  test_folds:
  - 10
  train_fraction: 0.1
